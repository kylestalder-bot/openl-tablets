# This workflow will release OpenL artifacts to the Central Maven repository.
# The web applications (*.war) are not published there: they are the assets of the GitHub release,
# together with their signatures and the DEMO package.

name: Release OpenL Tablets

on:
  # Manual run from the GitHub action page
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: false
      release:
        description: 'Release version'
        required: false
      snapshot:
        description: 'Snapshot version'
        required: false

permissions:
  contents: read

jobs:
  release:

    name: Release

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Configure GIT
        run: |
          git config --global user.name "OpenL Tablets"
          git config --global user.email openltablets@gmail.com
          git config --global core.autocrlf false

      - name: Checkout ${{ github.event.inputs.branch }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.branch }}
          path: release

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Prepare release
        working-directory: ./release
        env:
          SNAPSHOT_VERSION: ${{ github.event.inputs.snapshot }}
          RELEASE_VERSION: ${{ github.event.inputs.release }}
        run: >
          mvn release:prepare "-Dstyle.color=always"
          "-DdevelopmentVersion=${SNAPSHOT_VERSION}"
          "-DreleaseVersion=${RELEASE_VERSION}"
          -DautoVersionSubmodules=true
          -DtagNameFormat=@{project.version}
          -DpreparationGoals="clean validate"
          -DpushChanges=false
          -Psonar

      - name: Show commits
        working-directory: ./release
        run: git log --decorate -n 5

      - name: Stage GIT repository
        run: git clone -n --no-hardlinks ./release ./build

      - name: Checkout the latest tag
        working-directory: ./build
        run: |
          latestTag=$(git describe --tags `git rev-list --tags --max-count=1`)
          echo checking out ${latestTag}
          git checkout ${latestTag}
          git log --decorate -n 20 --all --oneline --graph
          echo "RELEASE_TAG=${latestTag}" >> $GITHUB_ENV

      - name: Build & Deploy to local staging repository
        run: >
          mvn -f ./build/pom.xml "-Dstyle.color=always"
          deploy
          -Psources,gpg-sign
          -DnoPerf
          -DaltDeploymentRepository=local-staging::default::file:./mvn-staging
          "-Duser.name=${GITHUB_ACTOR}"
        env:
          SIGN_KEY: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          SIGN_KEY_PASS: ${{ secrets.OSSRH_GPG_PASSPHRASE }}

        # The wars make up nine tenths of the bundle, so Maven Central gets the libraries only. The war modules
        # deploy nothing, except Rule Services: other projects depend on its jar, and a deploy cannot leave out its
        # war, the main artifact. The GitHub release takes each war under the file name the build gives it, with
        # the signature the build made.
      - name: Take the wars out of the Maven Central bundle
        run: |
          set -euo pipefail
          mkdir release-assets
          take() { # <module directory> <war file name>
            local target="build/$1/target"
            mv "$target/$2" release-assets/
            # The signature is named after the artifact, <artifactId>-<version>.war.asc; it is the only one.
            mv "$target"/*.war.asc "release-assets/$2.asc"
          }
          take STUDIO/studio-backend openl-studio.war
          take WSFrontend/org.openl.rules.ruleservice.ws ruleservices.war
          take WSFrontend/org.openl.rules.ruleservice.ws.all ruleservices-all.war
          find mvn-staging \( -name '*.war' -o -name '*.war.*' \) -print -delete
          ls -l release-assets

      - name: Store release.zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: mvn-staging
          retention-days: 10

      - name: Store release.zip (local)
        working-directory: ./mvn-staging
        run: >
          zip -r ../release.zip .

      - name: Upload to https://central.sonatype.com/
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
        run: |
          set -euo pipefail
          # GitHub masks the secrets but not their base64 form, so mask it before anything can print it.
          BEARER="$(printf '%s:%s' "$OSSRH_USERNAME" "$OSSRH_TOKEN" | base64 -w0)"
          echo "::add-mask::$BEARER"
          curl --request POST --silent --show-error --fail-with-body \
            --header "Authorization: Bearer $BEARER" \
            --form "name=OpenL ${RELEASE_TAG} by ${GITHUB_ACTOR} #${GITHUB_RUN_NUMBER}" \
            --form bundle=@release.zip \
            https://central.sonatype.com/api/v1/publisher/upload

      - name: Push commits
        working-directory: ./release
        run: |
          git push
          git push --tags
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Create release on GitHub
        id: create_release
        working-directory: ./build/DEMO
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${RELEASE_TAG}" > ./openl.version
          zip -r "../../openl-tablets-demo-${RELEASE_TAG}.zip" .
          DOWNLOAD="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          gh release create "${RELEASE_TAG}" \
            ../../release-assets/* \
            "../../openl-tablets-demo-${RELEASE_TAG}.zip#openl-tablets-demo.zip" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "OpenL Tablets ${RELEASE_TAG} Released" \
            --draft \
            --notes-file - <<-EOF
            **OpenL Tablets ${RELEASE_TAG} is available.**
            More detailed information you can find at [Release Notes ${RELEASE_TAG}](//openl-tablets.org/release-notes?ver=${RELEASE_TAG}).

            All artifacts are ready for Downloads.
            * [Download OpenL Studio](${DOWNLOAD}/openl-studio.war)
            * [Download OpenL Rule Services](${DOWNLOAD}/ruleservices.war)
            * [Download OpenL Rule Services (All)](${DOWNLOAD}/ruleservices-all.war)
            * [Download OpenL DEMO installer](${DOWNLOAD}/openl-tablets-demo-${RELEASE_TAG}.zip)

            Each war comes with its OpenPGP signature: the asset of the same name with the .asc extension.

            Enjoy!
          EOF
